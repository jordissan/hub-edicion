<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hub de Edición · Dashboard</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hub de Edición">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070708; --card:#121214; --card2:#18181c; --border:#232329; --border2:#33333b; --hair:#1c1c21;
  --txt:#f4f4f6; --muted:#8f8f99; --dim:#585862;
  --accent:#c8f24e; --accent-block:#c8f24e; --ink:#0c0e07;
  --done:#c8f24e; --live:#5b9dff; --wait:#3a3a42;
  --track:#212127; --gauge-dim:#2b2b32; --tile:#191a1e; --accent2:#8b7ff0; --accent3:#fb923c;
  --body-bg:radial-gradient(1200px 600px at 78% -14%, #15160e 0%, #070708 54%);
  --btn-bg:linear-gradient(180deg,#1c1d21,#121214); --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-in-out:cubic-bezier(.77,0,.175,1);
  --shadow:0 1px 0 rgba(255,255,255,.025), 0 20px 44px -30px rgba(0,0,0,.85);
  --font-d:'Space Grotesk','Inter',-apple-system,sans-serif;
  --font-b:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
:root[data-theme="light"]{
  --bg:#eef0f4; --card:#ffffff; --card2:#f3f5f8; --border:#e4e7ed; --border2:#d6dae2; --hair:#edf0f4;
  --txt:#15171d; --muted:#626a78; --dim:#9aa2af;
  --accent:#6fae16; --accent-block:#caf24e; --ink:#1a1f08;
  --done:#5a9e1f; --live:#2563eb; --wait:#cfd5de;
  --track:#e9ecf1; --gauge-dim:#dde1e9; --tile:#eef1f6; --accent2:#7b6ef0; --accent3:#ec7a1e;
  --body-bg:radial-gradient(1100px 560px at 78% -12%, #e7ecdd 0%, #eef0f4 52%);
  --btn-bg:linear-gradient(180deg,#ffffff,#eef0f4);
  --shadow:0 1px 0 rgba(0,0,0,.01), 0 14px 30px -26px rgba(20,30,60,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-b);background:var(--body-bg) fixed;color:var(--txt);line-height:1.4;
  padding:30px 24px 60px;max-width:1280px;margin:0 auto;-webkit-font-smoothing:antialiased;transition:background-color .25s,color .25s;
  -webkit-tap-highlight-color:transparent}
::selection{background:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--txt)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
.d{font-family:var(--font-d)}
.card,.kpi,.stamp,.refresh{transition:background-color .25s,border-color .25s,color .25s}
.ic{display:inline-block;vertical-align:-0.18em;flex-shrink:0}
.clabel .ic,.gtitle .ic,.bname .ic,.seg2 .ic{vertical-align:middle}
@keyframes spin{to{transform:rotate(-360deg)}}
.refresh.spin .ic{animation:spin .9s linear infinite}

.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{font-family:var(--font-d);font-size:22px;font-weight:700;letter-spacing:-.5px;display:flex;align-items:center;gap:9px}
h1 .ic{color:var(--accent)}
.subtitle{font-size:12px;color:var(--muted);margin-top:4px}
.topright{display:flex;flex-direction:row;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btns{display:flex;gap:8px}
.refresh{font-family:inherit;font-size:12px;font-weight:600;color:var(--txt);cursor:pointer;background:var(--btn-bg);
  border:1px solid var(--border2);border-radius:10px;padding:8px 13px;transition:transform .16s var(--ease-out),border-color .16s ease,background-color .16s ease,color .16s ease;display:flex;align-items:center;gap:6px}
.refresh:hover{border-color:var(--accent)}.refresh:disabled{opacity:.6;cursor:default}.refresh.spin{color:var(--accent)}
.refresh:active{transform:scale(.97)}.refresh:disabled:active{transform:none}
.refresh.icon{padding:8px 10px}
.stamp{font-size:10.5px;color:var(--dim);text-align:right;white-space:nowrap;border:1px solid var(--border);border-radius:9px;padding:7px 11px;background:var(--card)}
.stamp b{color:var(--muted);font-weight:600}
.stamp .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:5px;box-shadow:0 0 0 3px rgba(200,242,78,.16)}
.stamp .dot.warn{background:#fbbf24;box-shadow:0 0 0 3px rgba(251,191,36,.16)}

.stack{display:flex;flex-direction:column;gap:14px}
.hubnav{display:inline-flex;gap:2px;background:var(--card2);border:1px solid var(--border);border-radius:13px;padding:3px}
.hubnav button{font-family:var(--font-b);font-size:12.5px;font-weight:600;color:var(--muted);background:none;border:none;border-radius:10px;padding:8px 16px;cursor:pointer;transition:background-color .15s ease,color .15s ease,transform .14s var(--ease-out)}
.hubnav button.on{background:var(--accent);color:var(--ink)}
.hubnav button:not(.on):hover{color:var(--txt)}
.hubnav button:active{transform:scale(.96)}
.view{display:none;flex-direction:column;gap:14px}
.view.on{display:flex}
#evol{display:flex;flex-direction:column}
.moneycard{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.moneyrow{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px}
.moneyrow>div{flex:1;min-width:96px;background:var(--tile);border:1px solid var(--border);border-radius:16px;padding:14px 16px}
.moneyrow .mh{background:var(--accent-block);border-color:transparent;box-shadow:0 16px 40px -26px color-mix(in srgb,var(--accent) 70%,transparent)}
.moneycard .mv{font-family:var(--font-d);font-size:28px;font-weight:700;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.moneyrow .mh .mv{font-size:34px;color:var(--ink)}
.moneycard .mv span{font-size:15px;color:var(--muted);font-weight:600}
.moneyrow .mh .mv span{color:rgba(12,14,7,.6)}
.moneyrow .proj{border-style:dashed;border-color:color-mix(in srgb,var(--accent) 50%,var(--border))}
.moneyrow .proj .mv{color:var(--accent)}
@media(max-width:600px){
  .moneyrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .moneyrow>div{min-width:0;padding:13px 14px}
  .moneycard .mv{font-size:23px}
  .moneyrow .mh .mv{font-size:26px}
  .moneycard .mv span{font-size:13px}
}
.moneycard .ml{font-size:11px;color:var(--muted);margin-top:7px}
.moneyrow .mh .ml{color:rgba(12,14,7,.66)}
.moneynote{font-size:11px;color:var(--dim);margin-top:14px;padding-top:12px;border-top:1px solid var(--hair)}
.lgrow .lgh{min-width:78px;white-space:nowrap}
.lgsub{color:var(--dim);font-weight:400}
#resumenGrid{display:flex;flex-direction:column;gap:14px}
#resumenGrid:empty{display:none}
.resgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
.resgrid>*{min-width:0}
@media(max-width:860px){.resgrid{grid-template-columns:1fr}}
/* Distribución de horas: el círculo es el protagonista — crece para llenar la tarjeta y se
   adapta al ancho; la leyenda lo acompaña abajo en dos columnas. */
.distrib{display:flex;flex-direction:column}
.distrib-donut{flex:1;display:flex;align-items:center;justify-content:center;min-height:200px;margin:16px 0 20px}
.distrib .donutwrap{position:relative;flex:0 0 auto;height:100%;width:auto;aspect-ratio:1/1;max-height:360px;max-width:100%}
.distrib .donutwrap svg{width:100%;height:100%;display:block}
.distrib .donutpct .p{font-size:48px}
.distrib .donutpct .s{font-size:12px;margin-top:6px}
.lglist.distrib-leg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px 30px}
/* Cada valor en su propia columna (tabular, alineada a la derecha) → sin "diagonales".
   minmax(0,1fr) fuerza columnas iguales: los nombres largos se recortan en vez de desbordar el %. */
.distrib-leg .lgrow{gap:7px}
.distrib-leg .lgn{flex:1;min-width:0}
.distrib-leg .lgv{flex:0 0 auto;font-size:10px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.distrib-leg .lgv-m{min-width:48px;color:var(--muted);font-weight:600}
.distrib-leg .lgv-h{min-width:24px}
.distrib-leg .lgv-p{min-width:30px}
/* Apilado (≤860px): el círculo pasa a regirse por el ancho de la tarjeta y crece a lo disponible */
@media(max-width:860px){
  .distrib-donut{min-height:0}
  .distrib .donutwrap{height:auto;width:min(100%,320px);max-height:none}
}
@media(max-width:560px){.lglist.distrib-leg{grid-template-columns:minmax(0,1fr)}}
.aipill{display:flex;align-items:center;gap:14px;background:var(--accent-block);border-radius:20px;padding:15px 18px;color:var(--ink);box-shadow:0 18px 44px -28px color-mix(in srgb,var(--accent) 70%,transparent)}
.aipill .ai-ic{flex:none;width:40px;height:40px;border-radius:13px;background:rgba(12,14,7,.14);display:flex;align-items:center;justify-content:center}
.aipill .ai-ic .ic{color:var(--ink)}
.aipill .ai-tx{flex:1;min-width:0}
.aipill .ai-tx .t{font-family:var(--font-d);font-weight:700;font-size:15px;letter-spacing:-.2px;line-height:1.25}
.aipill .ai-tx .s{font-size:11.5px;opacity:.74;margin-top:3px}
.aipill .ai-tag{flex:none;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.1px;background:rgba(12,14,7,.16);padding:5px 10px;border-radius:20px}
.metahd{display:flex;justify-content:space-between;align-items:flex-start;margin-top:14px}
.metasub{font-size:11px;color:var(--muted);margin-top:3px}
.metadate{font-family:var(--font-d);font-size:18px;font-weight:700;letter-spacing:-.5px}
.metalbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);margin-bottom:2px}
@media(max-width:520px){.aipill .ai-tag{display:none}}
.evol-sub{font-size:12px;color:var(--muted);margin:10px 0 2px}
.evolrec{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0 4px}
.evolrec .r{flex:1;min-width:160px;background:var(--tile);border:1px solid var(--border);border-radius:15px;padding:13px 15px}
.evolrec .r .l{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);display:flex;align-items:center;gap:6px}
.evolrec .r .l .ic{color:var(--accent)}
.evolrec .r .v{font-family:var(--font-d);font-size:20px;font-weight:700;margin-top:7px;letter-spacing:-.5px}
.evolrec .r .s{font-size:11px;color:var(--dim);margin-top:3px}
.evolcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(244px,1fr));gap:14px;margin:14px 0 18px}
.evolcard{background:var(--tile);border:1px solid var(--border);border-radius:18px;padding:16px 18px;transition:border-color .15s ease,transform .18s var(--ease-out)}
.evolcard:active{transform:scale(.99)}
.evolcard .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.evolcard .nm{font-family:var(--font-d);font-weight:700;font-size:14px}
.evolcard .big{font-family:var(--font-d);font-size:30px;font-weight:700;letter-spacing:-1px;margin:10px 0 2px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:9px}
.evolcard .mini{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px;margin-top:13px;padding-top:13px;border-top:1px solid var(--hair)}
.evolcard .mini>div{font-size:10.5px;color:var(--muted);display:flex;align-items:baseline;gap:6px}
.evolcard .mini b{font-family:var(--font-d);font-size:15px;color:var(--txt);font-weight:700;font-variant-numeric:tabular-nums}
.evolcard.partial{border-style:dashed}
.evolpartial{font-size:10px;color:var(--dim);margin-top:12px;padding-top:10px;border-top:1px dashed var(--border)}
.evolchg{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;white-space:nowrap}
.evolchg.up{color:var(--done);background:color-mix(in srgb,var(--done) 14%,transparent)}
.evolchg.down{color:#fb7185;background:rgba(251,113,133,.13)}
.evolchg.flat{color:var(--dim);background:var(--tile);border:1px solid var(--border)}
.evolcharts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.evolchart{background:var(--card2);border:1px solid var(--border);border-radius:16px;padding:15px 17px}
.evolchart .t{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.evolchart .t .ic{color:var(--accent)}
@media(max-width:760px){.evolcharts{grid-template-columns:1fr}}
/* Cap de altura para gráficas full-width: compactas en desktop, fluidas en móvil */
#horas svg,#bodas svg,#evol svg{max-height:270px}
@media(max-width:760px){#horas svg,#bodas svg,#evol svg{max-height:none}}
/* ── Nav inferior flotante (móvil): pill con blur, iconos + labels, safe-area aware ── */
.tabbar{display:none}
@media(max-width:760px){
  .hubnav{display:none}
  .tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:100;
    display:flex;gap:4px;padding:5px;border-radius:26px;
    background:color-mix(in srgb,var(--card) 78%,transparent);
    -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
    border:1px solid var(--border2);box-shadow:0 18px 44px -12px rgba(0,0,0,.65),0 1px 0 rgba(255,255,255,.04) inset}
  .tabbar button{font-family:var(--font-b);display:flex;flex-direction:column;align-items:center;gap:3px;
    min-width:86px;min-height:52px;justify-content:center;padding:7px 14px;border:none;border-radius:21px;
    background:none;color:var(--muted);cursor:pointer;
    transition:background-color .18s ease,color .18s ease,transform .16s var(--ease-out)}
  .tabbar button:active{transform:scale(.95)}
  .tabbar button .tbl{font-size:10px;font-weight:600;letter-spacing:.2px}
  .tabbar button .tbi{display:flex;line-height:0}
  .tabbar button.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
  body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
}
@media(max-width:600px){
  .topbar{flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px 8px;margin-bottom:14px}
  h1{font-size:19px;flex:0 1 auto;min-width:0}
  .topright{order:1;width:auto;margin-left:auto;flex-direction:row;align-items:center;gap:6px}
  .btns{width:auto;gap:6px}
  .refresh,.refresh.icon{padding:8px;background:var(--card2);border-color:var(--border)}
  .reflabel{display:none}
  .stamp{padding:6px 9px;font-size:10px;white-space:nowrap}
  .stamp .st-date{display:none}
  .hubnav{order:3;width:100%}
  .projsel{width:100%}
  .projsel select{flex:1;max-width:none}
}
#dailyk{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.cols{display:flex;gap:14px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.col-main{flex:1.45}
.col-side{flex:1}
/* Resumen: "Horas por día" y "Etapas completadas" igualan altura para cerrar a la misma línea
   con la tarjeta de abajo; la gráfica de barras se centra y llena el alto sobrante. */
@media(min-width:901px){
  #v-resumen .cols{align-items:stretch}
  #v-resumen .col>.card{flex:1}
  #horas{display:flex;flex-direction:column}
  .horas-chart{flex:1;display:flex;align-items:center;min-height:0;margin-top:4px}
  .horas-chart svg{width:100%}
}
#bodas{display:flex;flex-direction:column;gap:14px}
/* Browse ("Todas"): el detalle se queda fijo al hacer scroll por las secciones y arranca alineado a la 1ª tarjeta */
@media(min-width:901px){#v-bodas .cols:not(.stack):not(.split) .col-side{position:sticky;top:14px}}
/* Vista filtrada (pocas bodas): apila lista + detalle + timeline a lo ancho, sin columna lateral corta */
#v-bodas .cols.stack{flex-direction:column}
#v-bodas .cols.stack .col{width:100%;flex:1 1 auto}
#v-bodas .cols.stack .col-side{position:static;top:auto}
/* Boda seleccionada: gráfica y drilldown a 50/50 en el mismo renglón */
#v-bodas .cols.split .col-main,#v-bodas .cols.split .col-side{flex:1 1 0;min-width:0}
#v-bodas .cols.split .col-side{position:static;top:auto}
@media(max-width:600px){body{padding:20px 13px calc(96px + env(safe-area-inset-bottom,0px))}}
@media(max-width:900px){.cols{flex-direction:column}.col{flex:1 1 auto;width:100%}}
@media(max-width:600px){.boda{flex-direction:column;align-items:center;gap:16px}.donutwrap{flex:0 0 auto;width:min(100%,380px);height:auto;aspect-ratio:1/1;margin:2px auto 4px}.donutwrap svg{width:100%;height:100%}.donutpct .p{font-size:60px;letter-spacing:-3px}.donutpct .s{font-size:14px;margin-top:6px}.binfo{width:100%;min-width:0}#dailyk{grid-template-columns:1fr 1fr;gap:12px}.hk{padding:14px 15px}.hk .v{font-size:26px}.hk .l{font-size:9.5px;letter-spacing:1px}}

.card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.card.accent{background:var(--accent-block);border-color:transparent;color:var(--ink)}
.clabel{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;background:var(--tile);border:1px solid var(--border);border-radius:20px;padding:5px 11px}
.clabel .ic{color:var(--accent)}
.card.accent .clabel{background:rgba(12,14,7,.1);border-color:transparent}
.card.accent .clabel,.card.accent .clabel .ic{color:rgba(12,14,7,.66)}
.chip{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;border:1px solid var(--border2);color:var(--muted);white-space:nowrap}
.chip.live{color:var(--live);border-color:color-mix(in srgb,var(--live) 45%,transparent);background:color-mix(in srgb,var(--live) 12%,transparent)}
.chip.done{color:var(--done);border-color:color-mix(in srgb,var(--done) 45%,transparent);background:color-mix(in srgb,var(--done) 12%,transparent)}

#hero{display:flex;gap:30px;align-items:center;flex-wrap:wrap}
.gauge{flex:0 0 290px;max-width:310px;margin:0 auto}
.herobody{flex:1;min-width:260px}
.kpirow{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:12px}
.kpi{cursor:default;background:var(--tile);border:1px solid var(--border);border-radius:18px;padding:15px 16px;transition:border-color .18s ease,background-color .18s ease}
@media(hover:hover) and (pointer:fine){.kpi[data-tip]:hover{border-color:var(--border2);background:var(--card2)}}
.kpi .v{font-family:var(--font-d);font-size:31px;font-weight:700;letter-spacing:-1.3px;line-height:1}
.kpi .l{font-size:10.5px;color:var(--muted);margin-top:8px}
.focus{margin-top:18px;font-size:13px;background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;line-height:1.5}
.focus .ic{color:var(--live)}.focus b{color:var(--accent);font-weight:700}

.bodacard{cursor:pointer;transition:border-color .15s ease,box-shadow .15s ease,transform .2s var(--ease-out)}
.bodacard:active{transform:scale(.99)}
.bodacard.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
@media(hover:hover) and (pointer:fine){.bodacard:hover{border-color:var(--border2);transform:translateY(-2px)}}
/* ── Bodas: filtros por estado + secciones agrupadas ── */
.bfilters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.fchip{font-family:inherit;font-size:11px;font-weight:600;color:var(--muted);background:var(--card2);border:1px solid var(--border);border-radius:20px;padding:7px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;min-height:32px;transition:border-color .14s ease,color .14s ease,background-color .14s ease,transform .14s var(--ease-out)}
@media(hover:hover) and (pointer:fine){.fchip:hover{color:var(--txt);border-color:var(--border2)}}
.fchip:active{transform:scale(.96)}

.hk.b .v{color:var(--live)}.hk.a .v{color:var(--accent3)}

.distrib>.clabel,#horas>.clabel{align-self:flex-start}

.prog{margin-bottom:13px}

.prog .pl .pr{color:var(--muted);font-variant-numeric:tabular-nums}
/* Track con rayado diagonal sutil: lo pendiente se "raya", lo hecho es sólido (lenguaje Finpath/gantt) */
.progbar{height:12px;border-radius:8px;overflow:hidden;
  background:repeating-linear-gradient(135deg,var(--track) 0 5px,color-mix(in srgb,var(--track) 45%,transparent) 5px 9px)}
.progbar i{display:block;height:100%;border-radius:8px;transition:width .5s var(--ease-in-out)}

#tip{position:fixed;z-index:200;pointer-events:none;background:color-mix(in srgb,var(--card) 88%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--border2);border-radius:11px;
  padding:8px 11px;font-size:11.5px;color:var(--txt);box-shadow:0 12px 34px rgba(0,0,0,.55);opacity:0;

  transition:opacity .14s var(--ease-out),transform .14s var(--ease-out);max-width:250px;line-height:1.45}
#tip.show{opacity:1;transform:scale(1) translateY(0)}
#tip b{font-weight:700}
[data-tip]{cursor:pointer}.kpi[data-tip],.pill[data-tip],.stagerow[data-tip]{cursor:help}
/* Cifras tabulares: los números grandes no "bailan" al cambiar de valor */
.kpi .v,.hk .v,.bigpct,.donutpct .p,.tstrip .ts b,.ringmini .c .p{font-variant-numeric:tabular-nums}
/* Piso de calidad: foco visible para teclado + respeto a reduce-motion */
*:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.refresh:focus-visible{border-color:var(--accent)}
/* ── Interfaz viva · bases compartidas (desktop y táctil): transiciones GPU ── */
svg circle[data-tip]{transition:stroke-width .22s var(--ease-out),stroke-opacity .22s ease;cursor:pointer}
svg rect[data-tip]{transform-box:fill-box;transform-origin:50% 100%;transition:transform .22s var(--ease-out),opacity .22s ease;cursor:pointer}
.g-bar,.sessrow .sf{transition:filter .2s ease}
.kpi[data-tip]{transition:border-color .18s ease,background-color .18s ease,transform .18s var(--ease-out)}
.moneyrow>div{transition:transform .2s var(--ease-out),border-color .2s ease}
.evolrec .r{transition:transform .2s var(--ease-out),border-color .2s ease}
.lgrow .lgd,.stagerow .sd{transition:transform .18s var(--ease-out)}
.lgrow .lgn,.stagerow .sn,.sessrow .sl,.sessrow .sv{transition:color .16s ease}
.g-row{transition:background-color .16s ease;border-radius:8px}
.pill{transition:transform .16s var(--ease-out),border-color .16s ease}
.projsel{transition:border-color .18s ease}
#lineCard svg circle[data-tip]{transition:r .2s var(--ease-out)}
/* Feedback al presionar — también en táctil (el dedo recibe respuesta inmediata) */
svg circle[data-tip]:active{stroke-width:18}
svg rect[data-tip]:active{transform:scale(1.045)}
.pill:active,.kpi[data-tip]:active,.moneyrow>div:active,.evolrec .r:active{transform:scale(.97)}
/* ── Hover (solo cursor fino): el elemento bajo el cursor crece, el resto se atenúa ── */
@media(hover:hover) and (pointer:fine){
  svg:has(circle[data-tip]:hover) circle[data-tip]:not(:hover){stroke-opacity:.22}
  svg circle[data-tip]:hover{stroke-width:18}
  svg:has(rect[data-tip]:hover) rect[data-tip]:not(:hover){opacity:.4}
  svg rect[data-tip]:hover{transform:scale(1.045)}
  .g-bar:hover{filter:brightness(1.18)}
  .sessrow:hover .sf{filter:brightness(1.12)}
  /* Superficies: toda tarjeta reconoce al cursor con el borde (sin moverse: son contenedores) */
  .card:not(.accent):hover{border-color:var(--border2)}
  /* Tiles informativos con tooltip: micro-elevación */
  .kpi[data-tip]:hover{transform:translateY(-1px)}
  .moneyrow>div:hover{transform:translateY(-2px)}
  .evolrec .r:hover{transform:translateY(-2px);border-color:var(--border2)}
  /* Filas informativas: el renglón bajo el cursor toma foco (texto se aviva, punto crece) */
  .lgrow:hover .lgn,.stagerow:hover .sn,.sessrow:hover .sl,.sessrow:hover .sv{color:var(--txt)}
  .lgrow:hover .lgd,.stagerow:hover .sd{transform:scale(1.35)}
  .g-row:hover{background:color-mix(in srgb,var(--tile) 65%,transparent)}
  /* Píldoras de escenas y controles */
  .pill:hover{transform:translateY(-1px)}
  .projsel:hover{border-color:var(--border2)}
  /* Puntos de la gráfica de línea (tarjeta lima): crecen bajo el cursor */
  #lineCard svg circle[data-tip]:hover{r:5.5}
}
/* Centro del donut reactivo: pop suave al mostrar la etapa bajo el cursor */
@keyframes donutPeek{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.donutpct.peek>*{animation:donutPeek .18s var(--ease-out)}
.donutpct .s{max-width:76%;text-align:center}
/* Entrada orquestada: corre una sola vez por carga (los wrappers no se recrean al Actualizar) */
@keyframes hubRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.view.on>*{animation:hubRise .42s var(--ease-out) both}
.view.on>*:nth-child(2){animation-delay:.05s}
.view.on>*:nth-child(3){animation-delay:.1s}
.view.on>*:nth-child(4){animation-delay:.15s}
.view.on>*:nth-child(5){animation-delay:.2s}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
  .hk:hover,.bodacard:hover,.kpi[data-tip]:hover,.moneyrow>div:hover,.evolrec .r:hover,.pill:hover,
  .lgrow:hover .lgd,.stagerow:hover .sd,svg rect[data-tip]:hover{transform:none}
}
</style>

// ── Correcciones: trackean pero NO cuentan como tiempo de edición ──
function editStages(w){ return w.stages.filter(s=>!s.isCorrections); }

function corrRounds(w){ const rs=new Set(); let any=false; corrStages(w).forEach(s=>(s.sessionLog||[]).forEach(x=>{any=true; if(x.ronda!=null) rs.add(x.ronda);})); return rs.size||(any?1:0); }
function editComplete(w){ const e=editStages(w); return e.length>0&&e.every(s=>s.estado==='done'); }
function wedInCorr(w){ return /correc/i.test(w.status||''); }   // estado de boda en Notion ("Correcciones")

function wedProg(w){ const e=editStages(w); return e.length?e.reduce((a,x)=>a+stageProg(x),0)/e.length:0; }
function stageDays(st){ const s=parseD(st.start); if(!s) return null; const e=st.end?parseD(st.end):TODAY; return Math.max(1,dayDiff(s,e)+1); }

/* ───── Gráficas ───── */
function semiGauge(pct){
  // Línea de tiempo radial: las marcas se "encienden" como un level-meter y un
  // cabezal (playhead) marca el punto actual — guiño al timeline de edición.
  const cx=150,cy=150,rI=92,rO=120,N=46,lime=cv('--accent'),dim=cv('--gauge-dim'),txt=cv('--txt'),mut=cv('--muted');
  const lead=Math.round(pct/100*N);
  let t='';for(let i=0;i<=N;i++){const f=i/N,a=Math.PI-f*Math.PI,on=i<=lead;
    const op=on?(0.6+0.4*(lead?i/lead:1)):1;
    t+=`<line x1="${(cx+rI*Math.cos(a)).toFixed(1)}" y1="${(cy-rI*Math.sin(a)).toFixed(1)}" x2="${(cx+rO*Math.cos(a)).toFixed(1)}" y2="${(cy-rO*Math.sin(a)).toFixed(1)}" stroke="${on?lime:dim}" stroke-opacity="${op.toFixed(2)}" stroke-width="3.4" stroke-linecap="round"/>`;}
  const af=lead/N,aa=Math.PI-af*Math.PI,hx=cx+(rO+6)*Math.cos(aa),hy=cy-(rO+6)*Math.sin(aa);
  const head=pct>0?`<circle cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="8.5" fill="${lime}" fill-opacity=".15"/><circle cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="3.4" fill="${lime}"/>`:'';
  return `<svg viewBox="0 0 300 178" width="100%" style="display:block">${t}${head}<text x="150" y="138" text-anchor="middle" font-family="Space Grotesk,Inter,sans-serif" font-size="54" font-weight="700" fill="${txt}" style="letter-spacing:-2px;font-variant-numeric:tabular-nums">${pct}<tspan font-size="26" dx="2">%</tspan></text><text x="150" y="166" text-anchor="middle" font-size="11" fill="${mut}" font-weight="600" letter-spacing="2">AVANCE GLOBAL</text></svg>`;
}
function donut(stages){
  // Segmentos proporcionales a las HORAS reales por etapa, con gap real constante
  // y tamaño mínimo para que los arcos chicos no se encimen. Sin iniciar -> atenuado.
  const size=220,r=92,sw=13,cx=size/2,c=2*Math.PI*r,gapPx=24;
  const totalH=stages.reduce((a,s)=>a+(s.hours>0?s.hours:0),0);
  const minH=Math.max(totalH*0.07,1.4);                 // piso para arcos diminutos
  const weights=stages.map(s=>Math.max(s.hours>0?s.hours:0,minH));
  const wsum=weights.reduce((a,b)=>a+b,0)||1;
  let off=0,a='';
  stages.forEach((s,i)=>{
    const slot=weights[i]/wsum*c, len=Math.max(2,slot-gapPx), col=stageColor(s.etapa,i), op=s.estado==='wait'?0.24:1;
    const pctT=(totalH&&s.hours>0)?Math.round(s.hours/totalH*100):0;
    const tip=`<b>${esc(s.etapa)}</b><br>${estadoLabel(s.estado)}${s.hours>0?` · ${hrs(s.hours)}h (${pctT}% del tiempo)`:' · sin horas'}`;
    a+=`<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${col}" stroke-opacity="${op}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" data-tip="${tip}" data-eta="${esc(abbr(s.etapa))}" data-col="${col}"${s.hours>0?` data-h="${hrs(s.hours)}" data-p="${pctT}"`:''}/>`;
    off+=slot;
  });
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${cv('--track')}" stroke-width="${sw}"/>${a}</svg>`;
}
function ringMini(pct,color){const size=84,r=34,sw=9,cx=size/2,c=2*Math.PI*r,off=c*(1-pct/100);return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${cv('--track')}" stroke-width="${sw}"/><circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg>`;}
function barsChart(data){
  const W=560,H=150,padB=24,padT=18,padL=8,track=cv('--track'),axis=cv('--muted');
  const max=Math.max(1,...data.map(d=>d.value)),n=data.length||1,slot=(W-padL*2)/n,bw=Math.min(48,slot*0.62),th=H-padB-padT;
  let s='';data.forEach((d,i)=>{const x=padL+i*slot+(slot-bw)/2,fh=d.value>0?Math.max(bw,(d.value/max)*th):4,fy=H-padB-fh;
    s+=`<rect x="${x.toFixed(1)}" y="${padT}" width="${bw.toFixed(1)}" height="${th}" rx="${(bw/2).toFixed(1)}" fill="${track}"/>`;
    s+=`<rect x="${x.toFixed(1)}" y="${fy.toFixed(1)}" width="${bw.toFixed(1)}" height="${fh.toFixed(1)}" rx="${(bw/2).toFixed(1)}" fill="${d.color}" data-tip="${d.tip}"/>`;
    const inside=fh>32,ly=inside?fy+16:fy-6,lc=inside?cv('--ink'):cv('--txt');
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="11" font-weight="700" fill="${lc}">${d.label2}</text>`;
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-padB+14}" text-anchor="middle" font-size="9" fill="${axis}">${d.label}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${s}</svg>`;
}
function lineChart(points){
  const W=320,H=150,padL=22,padR=12,padB=22,padT=12;
  if(points.length<2) return '<div style="font-size:11px;opacity:.6;text-align:center;padding:26px">Datos insuficientes</div>';
  const ink=cv('--ink'),grid='rgba(12,14,7,.13)',axis='rgba(12,14,7,.55)';
  const xs=points.map(p=>+p.date),mnx=Math.min(...xs),mxx=Math.max(...xs),mxy=Math.max(...points.map(p=>p.y));
  const X=t=>padL+(mxx===mnx?0.5:(t-mnx)/(mxx-mnx))*(W-padL-padR),Y=v=>H-padB-(v/Math.max(1,mxy))*(H-padB-padT);
  let g='';for(let v=0;v<=mxy;v+=Math.ceil(mxy/4)||1){g+=`<line x1="${padL}" x2="${W-padR}" y1="${Y(v)}" y2="${Y(v)}" stroke="${grid}" stroke-width="1"/><text x="${padL-5}" y="${Y(v)+3}" fill="${axis}" font-size="8" text-anchor="end">${v}</text>`;}
  const path=points.map((p,k)=>(k?'L':'M')+X(+p.date).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const area=path+` L ${X(mxx).toFixed(1)} ${H-padB} L ${X(mnx).toFixed(1)} ${H-padB} Z`;
  const dots=points.map(p=>`<circle cx="${X(+p.date).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3" fill="${ink}" data-tip="${p.tip}"/>`).join('');
  const idx=[0,Math.floor(points.length/2),points.length-1];
  const xl=idx.map(i=>{const p=points[i];return `<text x="${X(+p.date).toFixed(1)}" y="${H-7}" fill="${axis}" font-size="8" text-anchor="middle">${fmtShort(p.date)}</text>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${g}<defs><linearGradient id="lg" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="${ink}" stop-opacity=".22"/><stop offset="100%" stop-color="${ink}" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#lg)"/><path d="${path}" fill="none" stroke="${ink}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xl}</svg>`;
}

function renderBodaSelector(){

}
function renderHero(){
  const weds=focusWeds(),one=selWed!=null;
  const all=weds.flatMap(w=>editStages(w));
  const gp=all.length?Math.round(all.reduce((a,s)=>a+stageProg(s),0)/all.length*100):0;
  const sd=all.filter(s=>s.estado==='done').length;
  const scenes=all.flatMap(s=>s.scenes||[]),scd=all.reduce((a,s)=>a+((s.estado==='done')?(s.scenes||[]).length:(s.scenes||[]).filter(x=>x.estado==='done').length),0);
  const totH=Math.round(all.reduce((a,s)=>a+(s.hours||0),0));
  const liveW=one?D.weddings[selWed]:D.weddings.find(w=>editStages(w).some(s=>s.estado==='live'));
  const liveStage=liveW&&editStages(liveW).find(s=>s.estado==='live');
  const liveScene=liveStage&&(liveStage.scenes||[]).find(s=>s.estado==='live');
  const proj=liveW?projectDelivery(liveW):null,liveDays=liveStage?stageDays(liveStage):null;
  const corrH=Math.round(weds.reduce((a,w)=>a+corrHours(w),0)),corrN=weds.reduce((a,w)=>a+corrSessions(w),0),corrR=weds.reduce((a,w)=>a+corrRounds(w),0);
  const kpis=[
    {v:`${sd}/${all.length}`,l:'Etapas completadas',t:`${sd} hechas · ${all.filter(s=>s.estado==='live').length} en curso · ${all.filter(s=>s.estado==='wait').length} pendientes`},
    {v:scenes.length?`${scd}/${scenes.length}`:'—',l:'Escenas completadas',t:`${scd} de ${scenes.length} escenas (etapas hechas cuentan completas)`},
    {v:totH?totH+'h':'—',l:'Horas de edición',t:'Suma de sesiones de edición (sin correcciones)'},
    {v:proj?fmtShort(proj):'—',l:'Entrega estimada',t:'Proyección según tu ritmo promedio por etapa'},
    {v:liveDays!=null?liveDays+'d':'—',l:'Días en etapa activa',t:liveStage?`${esc(liveStage.etapa)}: ${liveDays} día(s)`:'Sin etapa en curso'}];
  let focus;
  if(liveStage) focus=`${icon('play',13)} <span>En curso: <b>${esc(liveW.name)}</b> · ${esc(liveStage.etapa)}${liveScene?` · ${esc(liveScene.escena)}`:''}</span>`;
  else if(liveW&&editComplete(liveW)) focus=`${icon('check',13)} <span>Edición terminada${one?` · <b>${esc(liveW.name)}</b>`:''}${corrH>0?' · en correcciones':''}</span>`;

}
function bodaBarData(w){

function renderBodas(){

  // Modo de layout:

  const mode = selWed!=null ? 'split' : (bodaFilter!=='all' ? 'stack' : 'browse');

/* ───── Vista Hoy (avance por día) ───── */
function keyOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dowKey(k){return new Date(k+'T00:00:00').getDay();}            // 0 Dom..6 Sáb
function metaMin(k){const d=dowKey(k);return d===0?0:(d===6?120:300);} // 5h L-V · 2h Sáb · Dom descanso
function fmtHM(min){min=Math.round(min);const h=Math.floor(min/60),m=min%60;return h?(m?`${h}h ${m}min`:`${h}h`):`${m}min`;}
function fmtHMshort(min){min=Math.round(min);const h=Math.floor(min/60),m=min%60;return h?(m?`${h}h ${m}m`:`${h}h`):`${m}m`;}
function shortStage(et){const m={"Importación y Organización":"IO","Separación por Escenas":"SE","Limpieza":"LP","Sincronización":"SN","Musicalización":"MU","Edición Musical":"EM","Corrección de Color y Finalización":"CC","Selección de Material (HL/SF)":"SM","Selección Musical (HL/SF)":"SL","Montaje (HL/SF)":"MT"};return m[et]||(et||'').slice(0,2).toUpperCase();}
function allSessions(){const o=[];D.weddings.forEach(w=>w.stages.forEach(s=>(s.sessionLog||[]).forEach(x=>{if(x.inicio)o.push({name:x.name,inicio:x.inicio,key:x.inicio.slice(0,10),min:x.min||0,tipo:x.tipo,etapa:s.etapa,color:stageColor(s.etapa),wedding:w.name});})));return o;}
function focusSessions(){ const a=allSessions(); return (selWed!=null&&D.weddings[selWed])?a.filter(s=>s.wedding===D.weddings[selWed].name):a; }
function dayTotalsOf(ss){const m={};ss.forEach(s=>m[s.key]=(m[s.key]||0)+s.min);return m;}
function calcStreak(tot){let s=0;const d=parseD(D.today);if((tot[D.today]||0)<metaMin(D.today))d.setDate(d.getDate()-1);for(let i=0;i<120;i++){const k=keyOf(d);if(d.getDay()!==0){if((tot[k]||0)>=metaMin(k))s++;else break;}d.setDate(d.getDate()-1);}return s;}

function weekChart(tot){
  // En pantallas angostas usamos un viewBox más alto y angosto: barras grandes y texto a
  // tamaño real (el viewBox ancho de escritorio, encogido al ancho del móvil, se veía diminuto).
  const narrow=(typeof window!=='undefined')&&window.innerWidth<=620;
  const W=narrow?360:560, H=narrow?300:200, padB=narrow?40:30, padT=narrow?46:34, padL=narrow?10:8;
  const fVal=narrow?12:10, fDay=narrow?11.5:9.5, fMeta=narrow?11:9.5, valGap=narrow?9:8, rx=narrow?9:7;
  const lbl=m=>narrow?fmtHMshort(m):fmtHM(m);
  const days=[],t=parseD(D.today);for(let i=6;i>=0;i--){const d=new Date(t);d.setDate(d.getDate()-i);days.push(keyOf(d));}
  const vals=days.map(k=>(tot[k]||0)/60),maxRec=Math.max.apply(null,vals);
  // Headroom proporcional (como el widget): la barra más alta deja aire para su etiqueta.
  const maxY=Math.max(6,Math.ceil(maxRec*1.16)),n=days.length,gap=narrow?9:14,bw=(W-padL*2-gap*(n-1))/n,th=H-padB-padT;
  const Y=v=>H-padB-(v/maxY)*th,DOW=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"],mut=cv('--muted'),dim=cv('--dim');
  const my=Y(5);
  const skips=[],upper=[];   // skips: cruces de la línea; upper: etiquetas en la zona alta (para colocar "meta 5h")
  let bars='';
  days.forEach((k,i)=>{const v=vals[i],x=padL+i*(bw+gap),cx=x+bw/2,h=Math.max(v>0?3:0,(v/maxY)*th),y=H-padB-h,dw=dowKey(k),isToday=k===D.today,isRec=v>0&&v===maxRec&&!isToday,isSat=dw===6;
    const col=isToday?cv('--done'):isRec?'#fb923c':isSat?'#c4b5fd':'#8b7ff0';
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${rx}" fill="${col}" data-tip="<b>${DOW[dw]} ${k.slice(8)}</b><br>${fmtHM(v*60)}${metaMin(k)?' · meta '+fmtHM(metaMin(k)):' · descanso'}"/>`;
    if(v>0){const s=lbl(v*60),ly=y-valGap,lw=s.length*fVal*0.62+6,a=cx-lw/2,b=cx+lw/2;
      if(my>=ly-fVal-1&&my<=ly+4) skips.push([a,b]);   // su etiqueta cruza la línea de meta
      if(ly<=my+7) upper.push([a,b]);                  // etiqueta en la banda alta (donde iría "meta 5h")
      bars+=`<text x="${cx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="${fVal}" font-weight="700" fill="${mut}">${s}</text>`;}
    bars+=`<text x="${cx.toFixed(1)}" y="${H-padB+(narrow?20:16)}" text-anchor="middle" font-size="${fDay}" fill="${dim}">${DOW[dw]} ${k.slice(8)}</text>`;});
  // "meta 5h" se coloca donde NO choque con ninguna etiqueta de la zona alta: izquierda → derecha → hueco más ancho.
  const metaW='meta 5h'.length*fMeta*0.6+6;
  const fits=(a,b)=>!upper.some(s=>!(b<=s[0]||a>=s[1]));
  let mX,mAnchor,mRange;
  if(fits(padL,padL+metaW)){mX=padL+3;mAnchor='start';mRange=[padL,padL+metaW];}
  else if(fits(W-padL-metaW,W-padL)){mX=W-padL-3;mAnchor='end';mRange=[W-padL-metaW,W-padL];}
  else{const us=upper.slice().sort((p,q)=>p[0]-q[0]),um=[];us.forEach(s=>{const l=um[um.length-1];if(l&&s[0]<=l[1]+2)l[1]=Math.max(l[1],s[1]);else um.push(s.slice());});
    let gaps=[],c=padL;um.forEach(([a,b])=>{if(a-c>=metaW)gaps.push([c,a]);c=Math.max(c,b);});if(W-padL-c>=metaW)gaps.push([c,W-padL]);
    gaps.sort((p,q)=>(q[1]-q[0])-(p[1]-p[0]));const g=gaps[0]||[padL,padL+metaW],gc=(g[0]+g[1])/2;mX=gc;mAnchor='middle';mRange=[gc-metaW/2,gc+metaW/2];}
  skips.push(mRange);
  // Segmentos de la línea punteada, abriendo hueco en cada cruce de etiqueta y bajo "meta 5h".
  skips.sort((a,b)=>a[0]-b[0]);
  const merged=[];skips.forEach(s=>{const last=merged[merged.length-1];if(last&&s[0]<=last[1]+2)last[1]=Math.max(last[1],s[1]);else merged.push(s.slice());});
  const seg=(a,b)=>`<line x1="${a.toFixed(1)}" x2="${b.toFixed(1)}" y1="${my.toFixed(1)}" y2="${my.toFixed(1)}" stroke="${mut}" stroke-width="1" stroke-dasharray="5 5" opacity=".4"/>`;
  let line='',cur=padL;merged.forEach(([a,b])=>{if(a>cur)line+=seg(cur,a);cur=Math.max(cur,b);});if(cur<W-padL)line+=seg(cur,W-padL);
  const meta=`<text x="${mX.toFixed(1)}" y="${(my-6).toFixed(1)}" text-anchor="${mAnchor}" font-size="${fMeta}" fill="${mut}">meta 5h</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${line}${meta}${bars}</svg>`;
}

function aiInsight(){

  const live=weds.find(w=>editStages(w).some(s=>s.estado==='live'));
  if(live){ const del=projectDelivery(live),rem=editStages(live).filter(s=>s.estado==='wait').length;
    if(del) return {t:`A este ritmo entregas ${live.name} el ${fmtShort(del)}`,s:`${rem} etapa(s) por iniciar · proyección según tu ritmo promedio`}; }
  const sts=weddingsByDate();
  if(sts.length>=2){ const cur=sts[sts.length-1],prev=sts[sts.length-2];
    if(cur.hPerScene!=null&&prev.hPerScene!=null&&prev.hPerScene>0){ const d=Math.round((1-cur.hPerScene/prev.hPerScene)*100);
      if(d>0) return {t:`Editas ${d}% más rápido por escena que en ${prev.name}`,s:`${cur.hPerScene}h/escena ahora · ${prev.hPerScene}h/escena antes`};
      if(d<0) return {t:`Esta boda va ${Math.abs(d)}% más lenta por escena que ${prev.name}`,s:`${cur.hPerScene}h/escena ahora · ${prev.hPerScene}h/escena antes`}; }
    if(cur.span!=null&&prev.span!=null&&cur.span<prev.span) return {t:`Entregaste ${prev.span-cur.span} días más rápido que en ${prev.name}`,s:`${cur.span} días vs ${prev.span} días`}; }
  const h=Math.round(weds.reduce((a,w)=>a+wedHours(w),0));

}

/* ───── Evolución boda a boda ───── */
function weddingStats(w){
  const E=editStages(w),hours=Math.round(wedHours(w));
  const scenes=E.reduce((a,s)=>a+((s.scenes||[]).length),0);
  const dts=E.flatMap(s=>[s.start,s.end]).filter(Boolean).map(parseD).filter(Boolean).map(d=>+d);
  const span=dts.length?Math.max(1,dayDiff(new Date(Math.min(...dts)),new Date(Math.max(...dts)))+1):null;
  const hPerScene=scenes?Math.round(hours/scenes*10)/10:null;
  return {name:w.name,hours,scenes,span,hPerScene,rounds:corrRounds(w),perHour:hours?Math.round(wedPrice(w)/hours):null,lastEnd:dts.length?Math.max(...dts):0,complete:editComplete(w)};
}
function weddingsByDate(){ return D.weddings.map(weddingStats).sort((a,b)=>a.lastEnd-b.lastEnd); }
function chgChip(cur,prev,o){ o=o||{}; if(prev==null||cur==null) return ''; if(o.pct&&Math.abs(prev)<1e-9) return ''; const d=cur-prev; if(Math.abs(d)<1e-9) return `<span class="evolchg flat">=</span>`; const up=d>0,arrow=up?'▲':'▼'; let cls='flat'; if(!o.neutral){const good=o.lowerBetter?!up:up; cls=good?'up':'down';} const val=o.pct?Math.round(Math.abs(d)/Math.abs(prev)*100)+'%':(Math.round(Math.abs(d)*10)/10)+(o.unit||''); return `<span class="evolchg ${cls}">${arrow} ${val}</span>`; }
function evolLine(sts,val,unit,fmt){

  if(!pts.length) return `<div class="muted2" style="margin-top:8px">Aún sin datos.</div>`;
  const L=p=>fmt?fmt(p.y):(p.y+unit);
  const W=560,H=148,padL=16,padR=16,padB=24,padT=24,n=pts.length;
  const maxY=(Math.max(...pts.map(p=>p.y))||1)*1.2;
  const X=k=>padL+(n<=1?0.5:k/(n-1))*(W-padL-padR),Y=v=>H-padB-(v/maxY)*(H-padB-padT);
  const ink=cv('--accent'),txt=cv('--txt'),dim=cv('--dim');
  const path=pts.map((p,k)=>(k?'L':'M')+X(k).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const dots=pts.map((p,k)=>`<circle cx="${X(k).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="4.2" fill="${ink}" stroke="${cv('--card2')}" stroke-width="2" data-tip="<b>${esc(p.nm)}</b><br>${L(p)}"/>`).join('');
  const labs=pts.map((p,k)=>`<text x="${X(k).toFixed(1)}" y="${(Y(p.y)-11).toFixed(1)}" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="11" font-weight="700" fill="${txt}" style="font-variant-numeric:tabular-nums">${L(p)}</text>`).join('');
  const xl=pts.map((p,k)=>`<text x="${X(k).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="9" fill="${dim}">${esc(p.nm)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block"><path d="${path}" fill="none" stroke="${ink}" stroke-width="2.4" stroke-dasharray="2 5" stroke-linecap="round" stroke-linejoin="round"/>${dots}${labs}${xl}</svg>`;
}

    ? `<div class="evolchart"><div class="t">${icon('trend',11)} Rentabilidad · $/h <span style="color:var(--dim)">— más es mejor</span></div>${evolLine(done,s=>s.perHour,'',v=>fmtMoney(v))}</div>
       <div class="evolchart"><div class="t">${icon('check',11)} Eficiencia · h / escena <span style="color:var(--dim)">— menos es mejor</span></div>${evolLine(done,s=>s.hPerScene,'h')}</div>
       <div class="evolchart"><div class="t">${icon('hourglass',11)} Días para entregar <span style="color:var(--dim)">— menos es mejor</span></div>${evolLine(done,s=>s.span,'d')}</div>`
    : `<div class="evolchart" style="grid-column:1/-1"><div class="t">${icon('trend',11)} Tendencias de rentabilidad y eficiencia</div><div class="muted2" style="margin-top:8px">Con ${done.length} boda${done.length===1?'':'s'} completa${done.length===1?'':'s'} aún no hay tendencia — aparece al terminar 2+. Las curvas comparan solo proyectos completos para que sea justo.</div></div>`;
  const charts=`<div class="evolcharts"><div class="evolchart"><div class="t">${icon('clock',11)} Horas por boda</div>${barsChart(hb)}</div>${trend}</div>`;
  const note=done.length>=2
    ? `Tendencias sobre ${done.length} bodas completas, ordenadas por entrega.${inprog.length?` ${inprog.length} en progreso aún no entran.`:''}`
    : `Comparación justa = solo bodas completas (${done.length} de ${n}).${inprog.length?` En progreso: ${inprog.map(s=>s.name.split(' ')[0]).join(', ')} — entran al terminar.`:''}`;
  el.innerHTML=`<div class="clabel">${icon('trend',13)} Evolución · boda a boda</div><div class="evol-sub">${note}</div>${rec}<div class="evolcards">${cards}</div>${charts}`;
}
function showErr(e){ document.body.insertAdjacentHTML('beforeend',`<div style="color:#f87171;border:1px solid #5a1a1a;background:#1a0a0a;padding:14px;border-radius:10px;margin-top:20px;font-size:12px">Error: ${e.message}<br><pre style="white-space:pre-wrap;font-size:10px">${e.stack||''}</pre></div>`); console.error(e); }
function applyTheme(t){ document.documentElement.setAttribute('data-theme',t); try{localStorage.setItem('hubTheme',t);}catch(e){} const b=document.getElementById('themeBtn'); if(b)b.innerHTML=icon(t==='light'?'sun':'moon',15); }
function toggleTheme(){ applyTheme(document.documentElement.getAttribute('data-theme')==='light'?'dark':'light'); renderAll(); }

let _n=null;
function notice(m,c){ if(!_n){_n=document.createElement('div');_n.style.cssText='position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:120;font-size:12px;font-weight:600;padding:8px 16px;border-radius:10px;border:1px solid;backdrop-filter:blur(6px);pointer-events:none';document.body.appendChild(_n);} _n.textContent=m;_n.style.color=c;_n.style.borderColor=c;_n.style.background=cv('--card');_n.style.opacity='1';clearTimeout(_n._t);_n._t=setTimeout(()=>{_n.style.transition='opacity .5s';_n.style.opacity='0';},2600); }

async function load(fresh){
  const btn=document.getElementById('refreshBtn');
  if(btn){btn.disabled=true;btn.classList.add('spin');btn.innerHTML=icon('refresh',14)+'<span class="reflabel"> Actualizando…</span>';}
  let ok=false,err=null;
  try{const r=await fetch('/api/edicion',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(j&&j.error)throw new Error(j.error);if(!j||!j.weddings)throw new Error('respuesta inválida');D=j;D.__live=true;ok=true;}
  catch(e){err=e.message;D=window.SNAPSHOT_DATA;D.__live=false;}
  try{renderAll();}catch(e){showErr(e);}
  if(btn){btn.disabled=false;btn.classList.remove('spin');btn.innerHTML=icon('refresh',14)+'<span class="reflabel"> Actualizar</span>';}
  if(ok) notice(fresh?'✓ Datos actualizados desde Notion':'✓ Conectado en vivo','#7bd14a');
  else notice('Sin servidor en vivo — mostrando snapshot'+(err?' ('+err.slice(0,46)+')':''),'#fbbf24');
}

/* ───── Tooltip + interacción ───── */
const tip=document.createElement('div'); tip.id='tip'; document.body.appendChild(tip);
document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t){tip.innerHTML=t.getAttribute('data-tip');tip.classList.add('show');}});
document.addEventListener('mousemove',e=>{if(tip.classList.contains('show')){const x=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-10),y=Math.min(e.clientY+16,innerHeight-tip.offsetHeight-10);tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.max(8,y)+'px';}});
document.addEventListener('mouseout',e=>{if(e.target.closest&&e.target.closest('[data-tip]'))tip.classList.remove('show');});
/* Centro del donut reactivo: al pasar el cursor por un segmento, el centro muestra ESA etapa */
document.addEventListener('mouseover',e=>{
  const c=e.target.closest&&e.target.closest('.donutwrap circle[data-eta]'); if(!c)return;
  const pct=c.closest('.donutwrap')?.querySelector('.donutpct'); if(!pct)return;
  if(pct._orig==null)pct._orig=pct.innerHTML;
  const h=c.getAttribute('data-h'),p=c.getAttribute('data-p'),eta=c.getAttribute('data-eta'),col=c.getAttribute('data-col');
  pct.classList.add('peek');
  pct.innerHTML=h?`<div class="p" style="color:${col}">${h}h</div><div class="s">${eta} · ${p}%</div>`
               :`<div class="p" style="color:${col};opacity:.55">—</div><div class="s">${eta} · pendiente</div>`;
});
document.addEventListener('mouseout',e=>{
  const c=e.target.closest&&e.target.closest('.donutwrap circle[data-eta]'); if(!c)return;
  const pct=c.closest('.donutwrap')?.querySelector('.donutpct');
  if(pct&&pct._orig!=null){pct.classList.remove('peek');pct.innerHTML=pct._orig;pct._orig=null;}
});
function focusWedding(){ renderBodaSelector(); renderHero(); renderMoney(); renderResumenGrid(); renderDaily(); renderBodas(); renderDrill(); renderSesHoy(); renderHoras(); renderLine(); renderGantt(); renderAlerts(); }
function setWed(v){ selWed=(v==='all'||v==null)?null:+v; if(selWed!=null&&D.weddings[selWed])drillView=editStages(D.weddings[selWed]).some(s=>(s.scenes||[]).length)?'escenas':'etapas'; focusWedding(); }
document.addEventListener('change',e=>{ if(e.target.id==='bodaSelect') setWed(e.target.value); });
document.addEventListener('click',e=>{
  if(e.target.closest('[data-noselect]'))return;
  const tb=e.target.closest('[data-tab]'); if(tb){setTab(tb.getAttribute('data-tab'));return;}
  const bf=e.target.closest('[data-bfilter]'); if(bf){bodaFilter=bf.getAttribute('data-bfilter');renderBodas();return;}
  const dv=e.target.closest('[data-bodaview]'); if(dv){bodaView=dv.getAttribute('data-bodaview');renderBodas();return;}
  const bv=e.target.closest('[data-bars]'); if(bv){barsMetric=bv.getAttribute('data-bars');renderBodas();return;}
  const v=e.target.closest('[data-view]'); if(v){drillView=v.getAttribute('data-view');renderDrill();return;}
  const b=e.target.closest('[data-wed]'); if(b){setWed(+b.getAttribute('data-wed'));}
});

applyTheme(document.documentElement.getAttribute('data-theme')||'dark');
setTab(hubView);
document.getElementById('themeBtn').addEventListener('click',toggleTheme);
document.getElementById('refreshBtn').addEventListener('click',()=>load(true));
let _alignRAF,_lastNarrow=window.innerWidth<=620;window.addEventListener('resize',()=>{cancelAnimationFrame(_alignRAF);_alignRAF=requestAnimationFrame(()=>{alignDrill();const nw=window.innerWidth<=620;if(nw!==_lastNarrow){_lastNarrow=nw;try{renderHoras();}catch(e){}}});});
load(false);
</script>
</body>
