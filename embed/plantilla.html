<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Tarjeta de plantilla · Hub de Edición</title>
<!-- Marcador para la PLANTILLA de boda en Notion: ocupa el recuadro del /embed (que conserva su tamaño)
     y explica cómo cambiarlo por el enlace real de la boda (botón </> de la tarjeta en el dashboard).
     Sin datos ni clave. ?t=donut|etapas|cinta elige el nombre. Mismo tema que las tarjetas
     (scEmbedTheme general → &tema= → el del sistema, en vivo) y nada desplazable, para no robar el scroll a Notion. -->
<script>
// Misma regla que las tarjetas reales (index.html · embWantedLight): general «Tema de los widgets»
// (scEmbedTheme = light|dark; Auto = sin guardar) → &tema=claro|oscuro → aspecto del sistema.
// Cualquier otro valor guardado (p. ej. «auto») cuenta como Auto, no como oscuro (13-nov).
var SYS_LIGHT=null;try{SYS_LIGHT=matchMedia('(prefers-color-scheme: light)')}catch(e){}
function wantLight(){let t=null;try{t=localStorage.getItem('scEmbedTheme')}catch(e){}
  if(t==='light')return true;if(t==='dark')return false;
  const tm=new URLSearchParams(location.search).get('tema');
  return tm==='claro'?true:tm==='oscuro'?false:!!(SYS_LIGHT&&SYS_LIGHT.matches)}
function applyTheme(){const r=document.documentElement;if(wantLight())r.dataset.theme='light';else delete r.dataset.theme}
try{applyTheme()}catch(e){}
</script>
<style>
@font-face{font-family:'JetBrains Mono';font-weight:400 700;font-display:swap;src:url(/fonts/jetbrains-mono-latin-v1.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:400 600;font-display:swap;src:url(/fonts/inter-latin-v1.woff2) format('woff2')}
:root{--bg:#191919;--txt:#f0eee9;--dim:rgba(240,238,233,.55);--line:rgba(240,238,233,.16);--lima:#dcef4f;color-scheme:dark}
:root[data-theme="light"]{--bg:#ffffff;--txt:#1d1d1b;--dim:rgba(29,29,27,.55);--line:rgba(29,29,27,.18);--lima:#7a8a00;color-scheme:light}
html,body{height:100%;margin:0;overflow:hidden;overflow:clip;background:var(--bg);color:var(--txt)}
body{font:14px/1.45 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.box{position:fixed;inset:10px;border:1.5px dashed var(--line);border-radius:14px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;box-sizing:border-box}
.lbl{font:600 11px/1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.lbl b{color:var(--lima);font-weight:600}
h1{margin:0;font-size:clamp(15px,3.2vw,19px);font-weight:600;letter-spacing:-.01em}
ol{margin:2px 0 0;padding:0;list-style:none;color:var(--dim);font-size:12.5px;display:grid;gap:4px}
ol li span{font-family:'JetBrains Mono',ui-monospace,monospace;color:var(--txt)}
@media (max-height:150px){.box{inset:6px;gap:5px;padding:8px}h1{font-size:15px}ol{display:flex;flex-wrap:wrap;justify-content:center;column-gap:18px;font-size:11.5px}}
@media (max-height:150px) and (max-width:700px){ol{display:none}}
</style>
</head>
<body>
<div class="box">
  <div class="lbl"><span id="nm">Tarjeta de boda</span> · <b>plantilla</b></div>
  <h1>Reemplaza este enlace por el de la boda</h1>
  <ol>
    <li>1. Dashboard → abre la boda → botón <span>&lt;/&gt;</span> de esta tarjeta</li>
    <li>2. Aquí en Notion: <span>···</span> del recuadro → <span>Reemplazar</span> → pega el enlace</li>
  </ol>
</div>
<script>
const N={donut:'Horas y $ por etapa',etapas:'Etapas',cinta:'La cinta'};
const t=new URLSearchParams(location.search).get('t');
if(N[t])document.getElementById('nm').textContent=N[t];
// en vivo, sin recargar: el interruptor general (evento storage), el aspecto del sistema (atajo del iPhone,
// Centro de control, automático al anochecer) y al volver a la pestaña por si algún aviso se perdió
addEventListener('storage',e=>{if(e.key===null||e.key==='scEmbedThemeAt'||e.key==='scEmbedTheme')applyTheme()});
if(SYS_LIGHT){if(SYS_LIGHT.addEventListener)SYS_LIGHT.addEventListener('change',applyTheme);else if(SYS_LIGHT.addListener)SYS_LIGHT.addListener(applyTheme)}
addEventListener('pageshow',applyTheme);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)applyTheme()});
</script>
</body>
</html>
